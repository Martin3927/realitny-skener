name: Realitný skener

on:
  # Cez deň skener spúšťa Supabase presne každých 10 minút (pg_cron → workflow_dispatch) a radar Bazoša
  # pri novom inzeráte. GitHub plánovač je len záloha každú pol hodinu (kontroluje len vtedy, keď posledná kontrola bola pred 25+ min)
  # a nočná plná kontrola. GitHub počíta v UTC.
  schedule:
    - cron: "15,45 4-21 * * *"
    - cron: "17 1 * * *"
  workflow_dispatch:
    inputs:
      rezim:
        description: "Režim kontroly"
        type: choice
        options: [bezny, rychly, plny]
        default: bezny

permissions:
  contents: read

concurrency:
  group: skener
  cancel-in-progress: false

jobs:
  skenuj:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Inštalácia
        run: pip install -r requirements.txt

      - name: Kontrola portálov
        timeout-minutes: 35
        env:
          PYTHONUNBUFFERED: "1"
          # adresa a verejný kľúč databázy (nie sú tajné – práva stráži databáza)
          SUPABASE_URL: https://uwxziqapghlyktwpipjd.supabase.co
          SUPABASE_KEY: sb_publishable_ukjo7DCX1FMYly7NU4gtxg_suIF66nf
          # tajný kľúč skenera – nastavuje sa v Settings → Secrets and variables → Actions
          SKENER_KLUC: ${{ secrets.SKENER_KLUC }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          DASHBOARD_URL: https://app.realitnytypek.sk/
          PLAN: ${{ github.event.schedule }}
          REZIM: ${{ inputs.rezim }}
        run: |
          set -o pipefail
          {
          if [ "$PLAN" = "17 1 * * *" ] || [ "$REZIM" = "plny" ]; then
            python skener.py --plny
          elif [ -n "$PLAN" ]; then
            python skener.py --zaloha
          elif [ "$REZIM" = "rychly" ]; then
            python skener.py --rychly
          else
            python skener.py
          fi
          } 2>&1 | tee beh.log

      # strážca: zlyhanú kontrolu zapíše do databázy; po 2. zlyhaní po sebe pošle adminovi upozornenie do mobilu
      - name: Strážca – upozornenie adminovi
        if: failure()
        env:
          SUPABASE_URL: https://uwxziqapghlyktwpipjd.supabase.co
          SUPABASE_KEY: sb_publishable_ukjo7DCX1FMYly7NU4gtxg_suIF66nf
          SKENER_KLUC: ${{ secrets.SKENER_KLUC }}
        run: python skener.py --zlyhanie beh.log || true
