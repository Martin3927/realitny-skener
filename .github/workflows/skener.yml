name: Realitný skener

on:
  schedule:
    # GitHub počíta v UTC: v lete 6:00–23:59, v zime 5:00–22:59 slovenského času
    # bežná kontrola (3 strany výsledkov) každú pol hodinu
    - cron: "0,30 4-21 * * *"
    # rýchla kontrola (len 1. strana – tam sú nové inzeráty) medzi nimi, ~20 požiadaviek s nepravidelnými pauzami
    - cron: "10,20,40,50 4-21 * * *"
    # plná kontrola v noci
    - cron: "17 1 * * *"
  workflow_dispatch:
    inputs:
      plny:
        description: "Prejsť všetky strany (plná kontrola)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: skener
  cancel-in-progress: false

jobs:
  skenuj:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Inštalácia
        run: pip install -r requirements.txt

      - name: Kontrola portálov
        env:
          # adresa a verejný kľúč databázy (nie sú tajné – práva stráži databáza)
          SUPABASE_URL: https://uwxziqapghlyktwpipjd.supabase.co
          SUPABASE_KEY: sb_publishable_ukjo7DCX1FMYly7NU4gtxg_suIF66nf
          # tajný kľúč skenera – nastavuje sa v Settings → Secrets and variables → Actions
          SKENER_KLUC: ${{ secrets.SKENER_KLUC }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          DASHBOARD_URL: https://app.realitnytypek.sk/
        run: |
          if [ "${{ github.event.schedule }}" = "17 1 * * *" ] || [ "${{ inputs.plny }}" = "true" ]; then
            python skener.py --plny
          elif [ "${{ github.event.schedule }}" = "10,20,40,50 4-21 * * *" ]; then
            python skener.py --rychly
          else
            python skener.py
          fi
