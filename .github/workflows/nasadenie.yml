name: Nasadenie na realitnytypek.sk

# Po každej zmene v priečinku docs/ nahrá súbory na hosting Websupport:
#   realitnytypek.sk      ← docs/web  (predajný web)
#   app.realitnytypek.sk  ← docs      (softvér pre maklérov)
# Prístup na FTP sa nastavuje v Settings → Secrets and variables → Actions: FTP_SERVER, FTP_USER, FTP_HESLO.
# Kým nie sú vyplnené, nasadenie sa preskočí (stránka beží ďalej na GitHub Pages).

on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/nasadenie.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nasadenie
  cancel-in-progress: false

jobs:
  nahraj:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MA_FTP: ${{ secrets.FTP_HESLO != '' }}
      APP: https://app.realitnytypek.sk/
    steps:
      - name: Prístup na FTP
        if: env.MA_FTP != 'true'
        run: echo "::notice::FTP prístup ešte nie je nastavený – nasadenie preskakujem."

      - uses: actions/checkout@v4
        if: env.MA_FTP == 'true'

      - name: Príprava súborov
        if: env.MA_FTP == 'true'
        run: |
          mkdir -p build/app build/web
          cp -r docs/. build/app/ && rm -rf build/app/web
          cp -r docs/web/. build/web/
          # predajný web je na hlavnej doméne – odkaz „Prihlásiť sa / Vyskúšať“ vedie do aplikácie
          sed -i 's#href="\.\./"#href="'"$APP"'"#g' build/web/*.html
          cat > build/app/.htaccess <<'EOF'
          RewriteEngine On
          RewriteCond %{HTTPS} off
          RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
          # vlastná doména makléra (napr. janakovacova.sk): www → bez www, úvod je jeho web,
          # stránky softvéru sa otvárajú na app.realitnytypek.sk
          RewriteCond %{HTTP_HOST} !(^|\.)realitnytypek\.sk$ [NC]
          RewriteCond %{HTTP_HOST} ^www\.(.+)$ [NC]
          RewriteRule ^ https://%1%{REQUEST_URI} [L,R=301]
          RewriteCond %{HTTP_HOST} !(^|\.)realitnytypek\.sk$ [NC]
          RewriteRule ^(index\.html)?$ stranka.php [L,QSA]
          # web kancelárie na vlastnej doméne: podstránky /ponuky, /o-nas, /blog/nazov-clanku …
          RewriteCond %{HTTP_HOST} !(^|\.)realitnytypek\.sk$ [NC]
          RewriteRule ^(ponuky|ponuka|predane|o-nas|sluzby|vykup|tim|kariera|blog|kontakt)(?:/([a-z0-9-]{1,80}))?/?$ stranka.php?s=$1&c=$2 [L,QSA]
          RewriteCond %{HTTP_HOST} !(^|\.)realitnytypek\.sk$ [NC]
          RewriteRule ^(?!stranka\.html$|kancelaria\.html$)[^/]+\.html$ https://app.realitnytypek.sk/$0 [L,R=302]
          # web makléra pripravený serverom (Google, Facebook, WhatsApp); stranka.html zostáva ako záloha
          RewriteRule ^stranka\.html$ stranka.php [L,QSA]
          # stránka ponuky pripravená serverom: pri zdieľaní na Facebooku či WhatsAppe ukáže fotku, názov a cenu
          RewriteRule ^ponuka\.html$ ponuka.php [L,QSA]
          RewriteRule ^robots\.txt$ robots.php [L]
          RewriteRule ^sitemap\.xml$ sitemap.php [L]
          RewriteRule ^_ - [F]
          <IfModule mod_headers.c>
            <FilesMatch "\.(html|webmanifest)$|^sw\.js$">
              Header set Cache-Control "no-cache"
            </FilesMatch>
            # bezpečnosť: prehliadač nehádá typ súborov, neposiela celé adresy cudzím webom
            Header always set X-Content-Type-Options "nosniff"
            Header always set Referrer-Policy "strict-origin-when-cross-origin"
            # aplikáciu (prihlásenie, správa, editor webu) nemôže cudzia stránka vložiť do rámčeka
            <FilesMatch "^(index|sprava|web-editor|web-kancelarie)\.html$">
              Header always set X-Frame-Options "SAMEORIGIN"
            </FilesMatch>
          </IfModule>
          # len pre app.realitnytypek.sk: prehliadač sa sem pripája vždy cez HTTPS (vlastné domény maklérov sa nemenia)
          <IfModule mod_setenvif.c>
            SetEnvIfNoCase Host "^app\.realitnytypek\.sk$" TYPEK_APP
            <IfModule mod_headers.c>
              Header always set Strict-Transport-Security "max-age=31536000" env=TYPEK_APP
            </IfModule>
          </IfModule>
          EOF
          cat > build/web/.htaccess <<'EOF'
          RewriteEngine On
          RewriteCond %{HTTPS} off [OR]
          RewriteCond %{HTTP_HOST} ^www\. [NC]
          RewriteRule ^ https://realitnytypek.sk%{REQUEST_URI} [L,R=301]
          RewriteRule ^app/?(.*)$ https://app.realitnytypek.sk/$1 [L,R=301]
          # Týpkove nehnuteľnosti: detail ponuky na peknej adrese /nehnutelnosti/123-nazov-ponuky (server pripraví náhľad pre zdieľanie)
          RewriteRule ^nehnutelnosti/([0-9]{1,10}(?:-[a-z0-9-]{0,100})?)/$ https://realitnytypek.sk/nehnutelnosti/$1 [L,R=301]
          RewriteRule ^nehnutelnosti/([0-9]{1,10})(?:-[a-z0-9-]{0,100})?$ nehnutelnosti/ponuka.php?id=$1 [L,QSA]
          # článok: /nehnutelnosti/clanky/nazov-clanku
          RewriteRule ^nehnutelnosti/clanky/([a-z0-9-]{1,100})/?$ nehnutelnosti/clanok.php?s=$1 [L,QSA]
          <IfModule mod_headers.c>
            <FilesMatch "\.html$">
              Header set Cache-Control "no-cache"
              Header always set X-Frame-Options "SAMEORIGIN"
            </FilesMatch>
            Header always set X-Content-Type-Options "nosniff"
            Header always set Referrer-Policy "strict-origin-when-cross-origin"
            Header always set Strict-Transport-Security "max-age=31536000"
          </IfModule>
          EOF

      - name: Nahrať aplikáciu aj web (SFTP)
        if: env.MA_FTP == 'true'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_HESLO: ${{ secrets.FTP_HESLO }}
          DIR_APP: ${{ vars.FTP_DIR_APP || '/realitnytypek.sk/sub/app' }}
          DIR_WEB: ${{ vars.FTP_DIR_WEB || '/realitnytypek.sk/web' }}
        run: |
          sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq lftp >/dev/null
          lftp -u "$FTP_USER,$FTP_HESLO" "sftp://$FTP_SERVER" -e "
            set sftp:auto-confirm yes; set net:max-retries 2; set net:timeout 30;
            mirror -R --verbose=1 --parallel=4 build/app/ $DIR_APP;
            mirror -R --verbose=1 --parallel=4 build/web/ $DIR_WEB;
            bye"
