name: Nasadenie na realitnytypek.sk

# Po každej zmene v priečinku docs/ nahrá súbory na hosting Websupport:
#   realitnytypek.sk      ← docs/web  (predajný web)
#   app.realitnytypek.sk  ← docs      (softvér pre maklérov)
# Prístup na FTP sa nastavuje v Settings → Secrets and variables → Actions: FTP_SERVER, FTP_USER, FTP_HESLO.
# Kým nie sú vyplnené, nasadenie sa preskočí (stránka beží ďalej na GitHub Pages).

on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/nasadenie.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nasadenie
  cancel-in-progress: false

jobs:
  nahraj:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MA_FTP: ${{ secrets.FTP_HESLO != '' }}
      APP: https://app.realitnytypek.sk/
    steps:
      - name: Prístup na FTP
        if: env.MA_FTP != 'true'
        run: echo "::notice::FTP prístup ešte nie je nastavený – nasadenie preskakujem."

      - uses: actions/checkout@v4
        if: env.MA_FTP == 'true'

      - name: Príprava súborov
        if: env.MA_FTP == 'true'
        run: |
          mkdir -p build/app build/web
          cp -r docs/. build/app/ && rm -rf build/app/web
          cp -r docs/web/. build/web/
          # predajný web je na hlavnej doméne – odkaz „Prihlásiť sa / Vyskúšať“ vedie do aplikácie
          sed -i 's#href="\.\./"#href="'"$APP"'"#g' build/web/*.html
          cat > build/app/.htaccess <<'EOF'
          RewriteEngine On
          RewriteCond %{HTTPS} off
          RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
          # roboty sociálnych sietí dostanú web makléra s fotkou a názvom ponuky (zdielaj.php)
          RewriteCond %{HTTP_USER_AGENT} (facebookexternalhit|Facebot|WhatsApp|Twitterbot|LinkedInBot|Slackbot|TelegramBot|Discordbot|Viber|SkypeUriPreview|Pinterest|redditbot|vkShare|Snapchat|Iframely|Embedly|Applebot|Mastodon) [NC]
          RewriteRule ^stranka\.html$ zdielaj.php [L,QSA]
          <IfModule mod_headers.c>
            <FilesMatch "\.(html|webmanifest)$|^sw\.js$">
              Header set Cache-Control "no-cache"
            </FilesMatch>
          </IfModule>
          EOF
          cat > build/web/.htaccess <<'EOF'
          RewriteEngine On
          RewriteCond %{HTTPS} off [OR]
          RewriteCond %{HTTP_HOST} ^www\. [NC]
          RewriteRule ^ https://realitnytypek.sk%{REQUEST_URI} [L,R=301]
          RewriteRule ^app/?(.*)$ https://app.realitnytypek.sk/$1 [L,R=301]
          <IfModule mod_headers.c>
            <FilesMatch "\.html$">
              Header set Cache-Control "no-cache"
            </FilesMatch>
          </IfModule>
          EOF

      - name: Nahrať aplikáciu aj web (SFTP)
        if: env.MA_FTP == 'true'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_HESLO: ${{ secrets.FTP_HESLO }}
          DIR_APP: ${{ vars.FTP_DIR_APP || '/realitnytypek.sk/sub/app' }}
          DIR_WEB: ${{ vars.FTP_DIR_WEB || '/realitnytypek.sk/web' }}
        run: |
          sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq lftp >/dev/null
          lftp -u "$FTP_USER,$FTP_HESLO" "sftp://$FTP_SERVER" -e "
            set sftp:auto-confirm yes; set net:max-retries 2; set net:timeout 30;
            cls -1 /;
            mirror -R --verbose=1 --parallel=4 build/app/ $DIR_APP;
            mirror -R --verbose=1 --parallel=4 build/web/ $DIR_WEB;
            bye"
