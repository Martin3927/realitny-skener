name: Databáza (Supabase)

# Po každej zmene v supabase/migrations/ spustí nové súbory v databáze Supabase.
# Prístup sa nastavuje raz: Settings → Secrets and variables → Actions → SUPABASE_ACCESS_TOKEN
# (osobný kľúč zo supabase.com → Account → Access Tokens, prístup Database a Edge Functions: Read-write len pre projekt realitny-skener).
# Druhé tajomstvo GH_SPUSTANIE_TOKEN (GitHub, Actions: Read and write) sa uloží do Vaultu – ním Supabase spúšťa skener každých 10 min.
# Kým nie je vyplnený, krok sa preskočí.

on:
  push:
    branches: [main]
    paths: ["supabase/migrations/**", ".github/workflows/databaza.yml", ".github/nasad_databazu.py"]
  workflow_dispatch:
    inputs:
      bez_zalohy:
        description: "Bez zálohy pred zmenou (len v núdzi, keď záloha nejde)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: databaza
  cancel-in-progress: false

jobs:
  # Pred zmenou databázy záloha (zaloha.yml; ak posledná nie je staršia ako 2 h, novú nerobí).
  # Keď záloha zlyhá, zmeny sa nespustia. V núdzi: Run workflow → „Bez zálohy pred zmenou“.
  zaloha:
    if: ${{ !inputs.bez_zalohy }}
    uses: ./.github/workflows/zaloha.yml
    secrets: inherit
    with:
      dovod: pred-zmenou

  migracie:
    needs: zaloha
    if: ${{ !cancelled() && (needs.zaloha.result == 'success' || needs.zaloha.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MA_KLUC: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
    steps:
      - name: Prístup do Supabase
        if: env.MA_KLUC != 'true'
        run: echo "::notice::Kľúč SUPABASE_ACCESS_TOKEN ešte nie je nastavený – zmeny v databáze preskakujem."

      - uses: actions/checkout@v4
        if: env.MA_KLUC == 'true'

      - name: Spustiť nové zmeny v databáze
        if: env.MA_KLUC == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GH_SPUSTANIE_TOKEN: ${{ secrets.GH_SPUSTANIE_TOKEN }}
          SUPABASE_PROJEKT: ${{ vars.SUPABASE_PROJEKT || 'uwxziqapghlyktwpipjd' }}
        run: python3 .github/nasad_databazu.py

      - name: Hlásenie strážcovi prevádzky
        if: always() && env.MA_KLUC == 'true'
        env:
          SKENER_KLUC: ${{ secrets.SKENER_KLUC }}
          SB_URL: https://uwxziqapghlyktwpipjd.supabase.co
          SB_KEY: sb_publishable_ukjo7DCX1FMYly7NU4gtxg_suIF66nf
          STAV: ${{ job.status }}
        run: |
          [ -n "$SKENER_KLUC" ] || { echo "Bez SKENER_KLUC – strážcovi nehlásim."; exit 0; }
          hl() { curl -s -o /dev/null -w "hlásenie $2: %{http_code}\n" -X POST "$SB_URL/rest/v1/rpc/prevadzka_hlasenie" \
                   -H "apikey: $SB_KEY" -H "Content-Type: application/json" \
                   -d "$(jq -nc --arg k "$SKENER_KLUC" --arg d "$2" --argjson ok "$1" --arg t "$3" '{p_kluc:$k,p_druh:$d,p_ok:$ok,p_text:$t}')" || true; }
          hl "$([ "$STAV" = success ] && echo true || echo false)" databaza "Zmeny databázy sa nenasadili – pozri GitHub Actions → Databáza (Supabase)."
