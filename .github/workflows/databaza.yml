name: Databáza (Supabase)

# Po každej zmene v supabase/migrations/ spustí nové súbory v databáze Supabase.
# Prístup sa nastavuje raz: Settings → Secrets and variables → Actions → SUPABASE_ACCESS_TOKEN
# (osobný kľúč zo supabase.com → Account → Access Tokens, prístup Database: Read-write len pre projekt realitny-skener).
# Kým nie je vyplnený, krok sa preskočí.

on:
  push:
    branches: [main]
    paths: ["supabase/migrations/**", ".github/workflows/databaza.yml", ".github/nasad_databazu.py"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: databaza
  cancel-in-progress: false

jobs:
  migracie:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MA_KLUC: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
    steps:
      - name: Prístup do Supabase
        if: env.MA_KLUC != 'true'
        run: echo "::notice::Kľúč SUPABASE_ACCESS_TOKEN ešte nie je nastavený – zmeny v databáze preskakujem."

      - uses: actions/checkout@v4
        if: env.MA_KLUC == 'true'

      - name: Spustiť nové zmeny v databáze
        if: env.MA_KLUC == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJEKT: ${{ vars.SUPABASE_PROJEKT || 'uwxziqapghlyktwpipjd' }}
        run: python3 .github/nasad_databazu.py
