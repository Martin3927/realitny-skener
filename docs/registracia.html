<script>try { var t = localStorage.getItem("alpha-skener-tema"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
<style>
  .reg { align-items: start; padding-block: 32px }
  .reg .login-box { max-width: 460px; gap: 16px }
  .reg-hlava { display: grid; justify-items: center; gap: 6px; text-align: center }
  .reg-hlava img { height: 72px; width: auto }
  .reg-hlava h1 { font-size: 22px !important }
  .reg-balik { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-top: 4px }
  .reg-balik span { font-size: 12.5px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: var(--gold-soft); color: var(--ink) }
  .reg-zadarmo { text-align: center; font-weight: 600; color: var(--ink) !important }
  .reg input[readonly] { background: var(--surface-2); color: var(--muted) }
  .reg-okresy { display: grid; gap: 8px }
  .reg-okresy > span { font-size: 13px; font-weight: 600 }
  .reg-okr { display: flex; gap: 6px }
  .reg-okr select { flex: 1; min-width: 0 }
  .reg-okr button { flex: 0 0 auto; width: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); font-size: 18px; cursor: pointer }
  .reg-okr button:hover { color: var(--ink) }
  .reg-plus { justify-self: start; border: 0; background: none; color: var(--gold); font: inherit; font-weight: 700; font-size: 14px; cursor: pointer; padding: 2px 0 }
  .reg-pozn { font-size: 12.5px !important }
  .reg-suhlas { display: flex; gap: 10px; align-items: flex-start; font-size: 13.5px; color: var(--muted); line-height: 1.45 }
  .reg-suhlas input { margin-top: 3px; width: 18px; height: 18px; flex: 0 0 auto; accent-color: var(--gold-strong) }
  .reg-suhlas a { color: inherit }
  .reg-hotovo { text-align: center; display: grid; gap: 10px; justify-items: center }
  .reg-hotovo img { width: 120px; height: auto }
</style>
</head>
