<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1e2a35">
<title>Ako sa vám páčila obhliadka? · Alpha Reality</title>
<link rel="stylesheet" href="pisma/pisma.css?v=20261105">
<link rel="stylesheet" href="verejne.css?v=202610281600">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<style>
.r-wrap { max-width: 560px; margin: 0 auto; padding: 24px 16px 48px; display: grid; gap: 16px }
.r-hl { display: flex; gap: 14px; align-items: center }
.r-hl h1 { font-family: var(--display); font-size: 22px; margin: 0 }
form { display: grid; gap: 14px }
.hv { display: flex; gap: 6px; justify-content: center }
.hv button { font-size: 40px; line-height: 1; border: 0; background: none; cursor: pointer; color: var(--line); padding: 2px; transition: transform .1s }
.hv button.on { color: #e0a51a }
.hv button:active { transform: scale(.9) }
.hv-txt { text-align: center; font-weight: 600; min-height: 1.4em; color: var(--muted) }
label { display: grid; gap: 4px; font-weight: 600; font-size: 14px }
input, textarea { font: inherit; padding: 11px 13px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink) }
input:focus, textarea:focus { outline: 2px solid var(--gold-strong); border-color: transparent }
.suhlas { font-size: 12.5px; color: var(--muted); font-weight: 400 }
.dakujem { text-align: center; padding: 30px 10px }
.dakujem div { font-size: 54px }
.chyba { color: var(--bad); font-weight: 600 }
.ob-hl { display: grid; gap: 2px; text-align: center }
.ob-hl b { font-family: var(--display); font-size: 19px }
.ob-hl span { color: var(--muted); font-size: 14px }
</style>
</head>
<body data-kanc-caka>
<header class="v-top"><div class="v-wrap"><a href="https://www.alphareality.sk/" data-kanc-web><img src="logo.png" alt="Alpha Reality"></a><div class="v-top-t">Ďakujeme, že ste prišli na obhliadku</div></div></header>
<main class="r-wrap" id="obsah">
  <div class="v-box r-hl" id="mk"></div>
  <div class="v-box ob-hl" id="ob"><span>Načítavam…</span></div>
  <form class="v-box" id="f" hidden>
    <b style="text-align:center;font-family:var(--display);font-size:18px">Ako sa vám nehnuteľnosť páčila?</b>
    <div class="hv" id="hv" role="radiogroup" aria-label="Hodnotenie"></div>
    <div class="hv-txt" id="hv-txt"></div>
    <label>Čo sa vám páčilo?<textarea name="pacilo" rows="3" maxlength="1000" placeholder="napr. svetlé izby, pokojná lokalita"></textarea></label>
    <label>Čo sa vám nepáčilo alebo by vás presvedčilo?<textarea name="nepacilo" rows="3" maxlength="1000" placeholder="napr. cena, malá kuchyňa, chýba parkovanie"></textarea></label>
    <p class="suhlas">Hodnotenie je anonymné – nepýtame si meno ani kontakt. Pomôže majiteľovi aj nám ponuku zlepšiť. Majiteľ ho môže vidieť v prehľade predaja.</p>
    <div class="chyba" id="chyba" hidden></div>
    <button class="v-btn zlate" type="submit">Odoslať hodnotenie</button>
  </form>
</main>
<footer class="v-wrap v-pata">© <span data-kanc="firma">Alpha Reality s.r.o.</span><span data-kanc-cast="web"> · <a href="https://www.alphareality.sk/" data-kanc-web data-kanc-web-text>www.alphareality.sk</a></span></footer>
<script src="config.js?v=202610182100"></script>
<script src="verejne.js?v=202611031900"></script>
<script>
(function () {
  var T = window.TYPEK, esc = T.esc, t = T.param("t"), n = 0;
  var POPIS = ["", "Vôbec nie", "Skôr nie", "Ujde to", "Páčila sa mi", "Veľmi sa mi páčila!"];
  var hv = document.getElementById("hv"), f = document.getElementById("f"), ob = document.getElementById("ob");
  function kresli() {
    hv.innerHTML = [1, 2, 3, 4, 5].map(function (i) { return '<button type="button" role="radio" aria-checked="' + (i === n) + '" aria-label="' + i + ' z 5" data-i="' + i + '" class="' + (i <= n ? "on" : "") + '">★</button>'; }).join("");
    document.getElementById("hv-txt").textContent = POPIS[n] || "Ťuknite na hviezdičky";
    hv.querySelectorAll("button").forEach(function (b) { b.onclick = function () { n = Number(b.dataset.i); kresli(); }; });
  }
  function koniec(ik, h, p) { document.getElementById("obsah").innerHTML = '<div class="v-box dakujem"><div>' + ik + '</div><h1 style="font-family:var(--display)">' + h + "</h1><p>" + p + "</p></div>"; }
  kresli();
  T.rpc("hodnotenie_obhliadky_info", { p_token: t }).then(function (x) {
    if (!x) return koniec("🔗", "Odkaz nie je platný", "Skontrolujte, či ste ho skopírovali celý, alebo sa ozvite maklérovi.");
    T.kancelaria(x.kancelaria_id, x.kanc);
    if (x.vyplnene) return koniec("🙏", "Ďakujeme!", "Hodnotenie tejto obhliadky ste už poslali.");
    if (x.vyprsalo) return koniec("⏳", "Odkaz už vypršal", "Hodnotenie sa dá poslať do 30 dní od obhliadky.");
    ob.innerHTML = "<b>" + esc(x.nazov || "Nehnuteľnosť") + "</b><span>Obhliadka " + esc(T.datum(x.cas, true)) + "</span>";
    f.hidden = false;
    if (x.makler) T.rpc("verejny_makler", { p_id: x.makler }).then(function (m) {
      if (m) document.getElementById("mk").innerHTML = T.avatar(m, 58) + "<div><h1>" + esc(m.meno_cele || m.meno) + '</h1><span class="v-lok">' + (m.pohlavie === "zena" ? "maklérka" : "maklér") + ' · <span data-kanc="nazov">' + esc(T.kanc().nazov) + "</span></span></div>";
      else document.getElementById("mk").hidden = true;
    }).catch(function () { document.getElementById("mk").hidden = true; });
    else document.getElementById("mk").hidden = true;
  }).catch(function () { koniec("⚠️", "Niečo sa pokazilo", "Skúste stránku otvoriť znova o chvíľu."); });
  f.onsubmit = function (e) {
    e.preventDefault();
    var ch = document.getElementById("chyba"); ch.hidden = true;
    if (!n) { ch.textContent = "Vyberte počet hviezdičiek."; ch.hidden = false; return; }
    var b = f.querySelector("button[type=submit]"); b.disabled = true;
    T.rpc("hodnotenie_obhliadky_ulozit", { p_token: t, p_hviezdy: n, p_pacilo: f.pacilo.value, p_nepacilo: f.nepacilo.value }).then(function () {
      koniec("🙏", "Ďakujeme!", "Vaše hodnotenie nám veľmi pomôže. Ak by ste chceli nehnuteľnosť vidieť znova alebo sa na niečo spýtať, ozvite sa maklérovi.");
    }, function (err) { ch.textContent = (err && err.message) || "Hodnotenie sa nepodarilo odoslať."; ch.hidden = false; b.disabled = false; });
  };
})();
</script>
</body>
</html>
