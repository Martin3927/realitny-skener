<script>
(function () {
  var T = window.TYPEK, esc = T.esc, nf = T.nf, id = Number(T.param("id")), NAHLAD = T.param("nahlad") === "1", P = null, g = 0;
  var KAT = { byty: "🏢", domy: "🏠", chaty: "🏡", pozemky: "🌳", priestory: "🏬", objekty: "🏭", garaze: "🚗" };
  var ZDROJE = [["obhliadka", "Obhliadka"], ["kontakt", "Otázka"], ["callback", "Zavolajte mi"]];
  var KARTA = T.normKarta(null), KARTA_EDITOR = null;
  // editor skladačky (Správa → Karta nehnuteľnosti) posiela rozpracované nastavenie do náhľadu bez uloženia
  window.TYPEK_KARTA = function (k) {
    KARTA_EDITOR = k; KARTA = T.normKarta(k);
    if (P) { var y = window.scrollY; vykresli(); window.scrollTo(0, y); }
  };
  var Z = { zdroj: "obhliadka", v: {}, chyba: "", posiela: false, hotovo: false, obs: null, den: null, termin: null, terminTxt: "" };
  // ---------------------------------------------------------------- termín obhliadky (časy v slovenskom čase, nech je klient kdekoľvek)
  var TZ = "Europe/Bratislava", DNI = ["ne", "po", "ut", "st", "št", "pi", "so"], DNI_DLHE = ["nedeľa", "pondelok", "utorok", "streda", "štvrtok", "piatok", "sobota"];
  var HODINY = { 1: [9, 10, 11, 13, 14, 15, 16, 17], 2: [9, 10, 11, 13, 14, 15, 16, 17], 3: [9, 10, 11, 13, 14, 15, 16, 17], 4: [9, 10, 11, 13, 14, 15, 16, 17], 5: [9, 10, 11, 13, 14, 15, 16, 17], 6: [9, 10, 11] };
  function casti(d) { var o = {}; new Intl.DateTimeFormat("en-GB", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", hourCycle: "h23" }).formatToParts(d).forEach(function (x) { o[x.type] = x.value; }); return o; }
  function vBratislave(y, m, d, h) { var t = Date.UTC(y, m - 1, d, h) - 3600e3, hod = Number(casti(new Date(t)).hour); return new Date(t + (h - hod) * 3600e3); }
  function dniObhliadky() {
    var c = casti(new Date()), zaklad = Date.UTC(+c.year, +c.month - 1, +c.day), out = [];
    for (var i = 1; out.length < 10 && i < 16; i++) {
      var dt = new Date(zaklad + i * 864e5), wd = dt.getUTCDay(); if (!HODINY[wd]) continue;
      var y = dt.getUTCFullYear(), m = dt.getUTCMonth() + 1, d = dt.getUTCDate();
      out.push({ wd: wd, d: d, m: m, casy: HODINY[wd].map(function (h) {
        var od = vBratislave(y, m, d, h), obs = (Z.obs || []).some(function (x) { return od < new Date(x[1]) && new Date(od.getTime() + 3600e3) > new Date(x[0]); });
        return { h: h, iso: od.toISOString(), obs: obs };
      }) });
    }
    return out;
  }
  function vyberTerminu() {
    if (Z.obs === null) { nacitajObsadene(); return '<div class="v-termin"><span class="v-termin-h">Kedy sa vám hodí?</span><p class="v-mini" style="margin:0">Načítavam voľné termíny…</p></div>'; }
    var D = dniObhliadky(), vyb = Z.den != null ? D[Z.den] : null;
    return '<div class="v-termin"><span class="v-termin-h">Kedy sa vám hodí? <small>nepovinné – maklér termín potvrdí</small></span>' +
      '<div class="v-dni" role="group" aria-label="Deň obhliadky">' + D.map(function (x, i) {
        var volne = x.casy.some(function (c) { return !c.obs; });
        return '<button type="button" data-den="' + i + '" aria-pressed="' + (Z.den === i) + '"' + (volne ? "" : " disabled") + "><span>" + DNI[x.wd] + "</span><b>" + x.d + ". " + x.m + ".</b></button>";
      }).join("") + "</div>" +
      (vyb ? '<div class="v-casy" role="group" aria-label="Čas obhliadky">' + vyb.casy.map(function (c) {
        return '<button type="button" data-cas="' + c.iso + '" aria-pressed="' + (Z.termin === c.iso) + '"' + (c.obs ? ' disabled title="Obsadené"' : "") + ">" + c.h + ":00</button>";
      }).join("") + "</div>" : "") +
      (Z.termin ? '<p class="v-termin-vyb">Vybraný termín: <b>' + esc(Z.terminTxt) + "</b></p>" : "") + "</div>";
  }
  function nacitajObsadene() {
    if (Z.obsNacitavam) return; Z.obsNacitavam = true;
    T.rpc("obsadene_terminy", { p_id: P.id }).then(function (r) { Z.obs = Array.isArray(r) ? r : []; }, function () { Z.obs = []; })
      .then(function () { Z.obsNacitavam = false; if (!Z.hotovo && !Z.posiela) kresliFormular(); });
  }
  var IK_ZDIEL = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>';

  function toast(t) { var d = document.createElement("div"); d.className = "v-toast"; d.setAttribute("role", "status"); d.textContent = t; document.body.appendChild(d); setTimeout(function () { d.remove(); }, 2600); }
  // odkaz na ponuku bez „nahlad=1“ – ten sa klientom nikdy neposiela
  function odkaz() { var u = new URL(location.href); u.searchParams.delete("nahlad"); u.hash = ""; return u.href; }
  function sprava() { return "Dobrý deň, mám záujem o ponuku: " + T.nazov(P) + (P.cislo ? " (č. " + P.cislo + ")" : "") + " " + odkaz(); }
  function podobna() { return P.stav === "predane" || P.stav === "rezervovane"; }
  function zdielat() {
    var url = odkaz();
    if (navigator.share) { navigator.share({ title: T.nazov(P), text: T.nazov(P) + " – " + T.cena(P), url: url }).catch(function () {}); return; }
    (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject()).then(function () { toast("Odkaz je skopírovaný."); }, function () { prompt("Skopírujte odkaz:", url); });
  }

  // ---------------------------------------------------------------- galéria
  function galeria() {
    var F = P.fotky || [];
    if (!F.length) return '<div class="v-gal"><div class="v-gal-bez">' + (KAT[P.kategoria] || "🏠") + "</div></div>";
    return '<div class="v-gal"><div class="v-gal-hl" id="gal-hl"><img src="' + esc(T.fotkaUrl(F[g])) + '" alt="' + esc(T.nazov(P)) + ' – fotka ' + (g + 1) + '">' +
      (F.length > 1 ? '<button class="v-sip l" type="button" data-g="-1" aria-label="Predchádzajúca fotka">‹</button><button class="v-sip r" type="button" data-g="1" aria-label="Ďalšia fotka">›</button>' : "") +
      '<span class="v-poc">' + (g + 1) + " / " + F.length + "</span></div>" +
      (F.length > 1 ? '<div class="v-nahlady">' + F.map(function (f, n) {
        return '<button type="button" data-gi="' + n + '"' + (n === g ? ' aria-current="true"' : "") + ' aria-label="Fotka ' + (n + 1) + '"><img loading="lazy" src="' + esc(T.fotkaUrl(f)) + '" alt=""></button>';
      }).join("") + "</div>" : "") + "</div>";
  }
  function posunGaleriu(k) { var n = (P.fotky || []).length; if (n < 2) return; g = (g + k + n) % n; obnovGaleriu(); }
  function obnovGaleriu() {
    var st = document.querySelector(".v-gal"); if (!st) return;
    var d = document.createElement("div"); d.innerHTML = galeria(); st.replaceWith(d.firstChild); napojGaleriu();
  }
  function napojGaleriu() {
    var F = P.fotky || [];
    document.querySelectorAll("[data-g]").forEach(function (b) { b.onclick = function (e) { e.stopPropagation(); posunGaleriu(Number(b.dataset.g)); }; });
    document.querySelectorAll("[data-gi]").forEach(function (b) { b.onclick = function () { g = Number(b.dataset.gi); obnovGaleriu(); }; });
    var pas = document.querySelector(".v-nahlady"), akt = pas && pas.querySelector('[aria-current="true"]');
    if (akt) pas.scrollLeft = akt.offsetLeft - pas.clientWidth / 2 + akt.clientWidth / 2;
    // susedné fotky sa načítajú vopred, aby posúvanie bolo plynulé
    if (F.length > 1) [1, -1].forEach(function (k) { new Image().src = T.fotkaUrl(F[(g + k + F.length) % F.length]); });
    var hl = document.getElementById("gal-hl"); if (!hl) return;
    var x0 = null, y0 = 0;
    hl.addEventListener("touchstart", function (e) { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
    hl.addEventListener("touchend", function (e) {
      if (x0 == null) return;
      var dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0; x0 = null;
      // potiahnutie prstom doľava/doprava = ďalšia/predchádzajúca fotka (ťuknutie fotku zväčší)
      if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy) && F.length > 1) { e.preventDefault(); posunGaleriu(dx < 0 ? 1 : -1); }
    });
    hl.addEventListener("click", function (e) { if (!e.target.closest(".v-sip")) lightbox(); });
  }
  function lightbox() {
    var F = P.fotky || []; if (!F.length) return;
    var lb = document.createElement("div"); lb.className = "v-lb"; lb.setAttribute("role", "dialog"); lb.setAttribute("aria-label", "Fotky");
    function kresli() {
      lb.innerHTML = '<img src="' + esc(T.fotkaUrl(F[g])) + '" alt=""><button class="v-zavriet" type="button" aria-label="Zavrieť">✕</button>' +
        (F.length > 1 ? '<button class="v-sip l" type="button" data-lb="-1" aria-label="Predchádzajúca">‹</button><button class="v-sip r" type="button" data-lb="1" aria-label="Ďalšia">›</button>' : "") +
        '<span class="v-poc">' + (g + 1) + " / " + F.length + "</span>";
    }
    function posun(k) { g = (g + k + F.length) % F.length; kresli(); }
    function zavri() { lb.remove(); document.removeEventListener("keydown", kl); obnovGaleriu(); }
    function kl(e) { if (e.key === "Escape") zavri(); if (e.key === "ArrowRight") posun(1); if (e.key === "ArrowLeft") posun(-1); }
    lb.addEventListener("click", function (e) {
      var b = e.target.closest("[data-lb]"); if (b) { posun(Number(b.dataset.lb)); return; }
      if (e.target.closest(".v-zavriet") || e.target === lb) zavri();
    });
    var x0 = null;
    lb.addEventListener("touchstart", function (e) { x0 = e.touches[0].clientX; }, { passive: true });
    lb.addEventListener("touchend", function (e) { if (x0 == null) return; var dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 40) posun(dx < 0 ? 1 : -1); x0 = null; });
    document.addEventListener("keydown", kl);
    kresli(); document.body.appendChild(lb);
  }

  // ---------------------------------------------------------------- časti stránky
  function dlazdice() {
    var k = [], poz = P.kategoria === "pozemky";
    if (P.plocha_uzitkova && !poz) k.push([nf.format(P.plocha_uzitkova) + " m²", "plocha"]);
    if (P.plocha_pozemku) k.push([nf.format(P.plocha_pozemku) + " m²", "pozemok"]);
    if (P.izby && !poz) k.push([P.izby, P.izby === 1 ? "izba" : P.izby <= 4 ? "izby" : "izieb"]);
    if (P.kategoria === "byty" && P.poschodie !== null && P.poschodie !== undefined && P.poschodie !== "") {
      k.push([Number(P.poschodie) === 0 ? "prízemie" : P.poschodie + "." + (P.pocet_podlazi ? " z " + P.pocet_podlazi : ""), "poschodie"]);
    } else if (P.rok_vystavby) k.push([String(P.rok_vystavby), "rok výstavby"]);
    return k.slice(0, 4);
  }
  function cipy() {
    var c = [];
    if (P.exkluzivne) c.push(["Exkluzívne", ""]);
    if (P.znizena && !podobna()) c.push(["Znížená cena", "zlava"]);
    if (P.vhodne_pre_studentov) c.push(["Vhodné pre študentov", ""]);
    (P.specialne || []).forEach(function (s) {
      if (s === "Exkluzívne" || (s === "Zľava" && P.znizena)) return;
      c.push([s, s === "Zľava" ? "zlava" : ""]);
    });
    return c.length ? '<div class="v-cipy">' + c.map(function (x) { return '<span class="v-cip' + (x[1] ? " " + x[1] : "") + '">' + esc(x[0]) + "</span>"; }).join("") + "</div>" : "";
  }
  // energetická trieda ako farebné písmeno (A0 … G); „nemá“ a „v konaní“ ostávajú textom
  function energ(v) {
    var m = String(v || "").match(/^(A0|A1|[A-G])(?![a-z])/i);
    if (!m) return esc(v);
    var kod = m[1].toUpperCase(), zvysok = String(v).slice(m[0].length).replace(/^[\s–-]+/, "");
    return '<span class="v-energ e-' + kod.charAt(0) + (kod === "A0" ? "0" : "") + '">' + esc(kod) + "</span>" + (zvysok ? " " + esc(zvysok) : "");
  }
  function hypoteka() {
    if (P.transakcia === "prenajom" || podobna() || !P.cena || P.zobrazit_cenu === false) return "";
    if (P.typ_ceny && ["za nehnuteľnosť", "dohodou"].indexOf(P.typ_ceny) < 0) return "";
    function sl(k, nazov, min, max, krok, hod) {
      return '<label><span>' + nazov + ' <b data-hy-o="' + k + '"></b></span><input type="range" data-hy="' + k + '" min="' + min + '" max="' + max + '" step="' + krok + '" value="' + hod + '"></label>';
    }
    return '<section class="v-box" aria-labelledby="hy-h"><h2 id="hy-h">Koľko by ste splácali</h2><div class="v-hypo"><div class="v-hypo-sl">' +
      sl("d", "Vlastné zdroje", 10, 50, 5, 20) + sl("y", "Doba splácania", 5, 30, 1, 30) + sl("u", "Úrok", 1, Math.max(8, Math.ceil(KARTA.moznosti.urok + 1)), 0.1, KARTA.moznosti.urok) + "</div>" +
      '<div class="v-hypo-vys"><span>Mesačná splátka približne</span><strong data-hy-o="m"></strong><span data-hy-o="l"></span></div></div>' +
      '<p class="v-mini">Orientačný výpočet. Presnú ponuku vám pripraví hypotekárny špecialista – radi vám ho odporučíme.</p>' +
      '<div class="v-hypo-ziadost" id="hypo-ziadost">' + hypoZiadost() + "</div></section>";
  }
  // „Chcem ponuku hypotéky“ – kontakt príde maklérovi aj s číslami z kalkulačky
  var H = { otvorene: false, posiela: false, hotovo: false, chyba: "", v: {} };
  function hypoHodnoty() {
    var q = function (k) { var x = document.querySelector('[data-hy="' + k + '"]'); return x ? +x.value : 0; };
    var d = q("d"), y = q("y"), u = q("u"), L = P.cena * (1 - d / 100), r = u / 100 / 12, n = y * 12;
    return { d: d, y: y, u: u, L: L, m: r ? L * r / (1 - Math.pow(1 + r, -n)) : L / n };
  }
  function hypoZiadost() {
    if (H.hotovo) return '<p class="v-termin-vyb">Ďakujeme, s ponukou hypotéky sa vám ozveme čo najskôr.</p>';
    if (!H.otvorene) return '<button class="v-btn tmave" type="button" data-hypo-otvor>Chcem ponuku hypotéky</button>';
    return '<form class="v-form v-hypo-form" novalidate data-hypo-form><p class="v-zaujem-t">Pripravíme vám ponuku hypotéky podľa čísel z kalkulačky.</p>' +
      '<div class="v-hypo-polia"><label><span>Meno</span><input name="meno" autocomplete="name" maxlength="80" value="' + esc(H.v.meno || "") + '"></label>' +
      '<label><span>Telefón alebo e-mail</span><input name="kontakt" autocomplete="tel" maxlength="120" required value="' + esc(H.v.kontakt || "") + '"></label></div>' +
      '<input class="v-med" name="web" tabindex="-1" autocomplete="off" aria-hidden="true">' +
      (H.chyba ? '<p class="v-chyba" role="alert">' + esc(H.chyba) + "</p>" : "") +
      '<button class="v-btn zlate" type="submit"' + (H.posiela ? " disabled" : "") + ">" + (H.posiela ? "Odosielam…" : "Pošlite mi ponuku") + "</button>" +
      (NAHLAD ? '<p class="v-mini">Toto je náhľad – formulár sa neodošle.</p>' : "") + "</form>";
  }
  function kresliHypoZiadost(fokus) {
    var el = document.getElementById("hypo-ziadost"); if (!el) return;
    el.innerHTML = hypoZiadost();
    var ot = el.querySelector("[data-hypo-otvor]");
    if (ot) ot.onclick = function () { H.otvorene = true; kresliHypoZiadost("meno"); if (!NAHLAD) T.overenie("ponuka-" + P.id, "hypoteka"); };
    var f = el.querySelector("[data-hypo-form]");
    if (f) {
      f.addEventListener("input", function (e) { if (e.target.name && e.target.name !== "web") H.v[e.target.name] = e.target.value; });
      f.addEventListener("submit", function (e) { e.preventDefault(); odoslatHypo(f); });
    }
    if (fokus) { var x = el.querySelector('[name="' + fokus + '"]'); if (x) x.focus(); }
  }
  function odoslatHypo(f) {
    var kontakt = f.kontakt.value.trim(), meno = f.meno.value.trim(), med = f.web.value, h = hypoHodnoty();
    H.v = { meno: meno, kontakt: kontakt };
    if (NAHLAD) { toast("Toto je náhľad – formulár sa neodosiela."); return; }
    if (kontakt.length < 5) { H.chyba = "Napíšte telefón alebo e-mail, aby sme vám mohli ponuku poslať."; kresliHypoZiadost("kontakt"); return; }
    var co = "Hypotéka podľa kalkulačky: cena " + T.eur(P.cena) + ", vlastné zdroje " + h.d + " % (" + T.eur(P.cena * h.d / 100) + "), úver " + T.eur(h.L) +
      ", " + h.y + " rokov, úrok " + String(h.u.toFixed(1)).replace(".", ",") + " %, splátka približne " + T.eur(h.m) + " mesačne.";
    H.posiela = true; H.chyba = ""; kresliHypoZiadost();
    T.overenie("ponuka-" + P.id, "hypoteka").then(function (ov) {
      T.overeniePouzite("hypoteka");
      return T.rpc("ponuka_kontakt", { p_id: P.id, p_zdroj: "hypoteka", p_kontakt: kontakt, p_meno: meno || null, p_co: co, p_overenie: { ts: ov.ts, n: ov.n, med: med } });
    }).then(function () { T.udalost("zaujem", { formular: "hypoteka", id: P.id }); H.posiela = false; H.hotovo = true; kresliHypoZiadost(); }, function (e) {
      H.posiela = false; H.chyba = (e && e.message) || "Správu sa nepodarilo odoslať. Skúste to znova alebo zavolajte."; kresliHypoZiadost();
    });
  }
  function prepocitajHypoteku() {
    var q = function (k) { return document.querySelector('[data-hy="' + k + '"]'); }, o = function (k) { return document.querySelector('[data-hy-o="' + k + '"]'); };
    if (!q("d")) return;
    var d = +q("d").value, y = +q("y").value, u = +q("u").value, L = P.cena * (1 - d / 100), r = u / 100 / 12, n = y * 12;
    var m = r ? L * r / (1 - Math.pow(1 + r, -n)) : L / n;
    o("d").textContent = d + " % (" + T.eur(P.cena * d / 100) + ")";
    o("y").textContent = y + (y < 5 ? " roky" : " rokov");
    o("u").textContent = String(u.toFixed(1)).replace(".", ",") + " %";
    o("m").textContent = T.eur(m);
    o("l").textContent = "Úver " + T.eur(L);
  }
  function makler() {
    var m = P.makler || {}, tel = T.telOdkaz(m.telefon), text = sprava();

  // ---------------------------------------------------------------- formulár záujmu → kontakt v Týpkovi
  function formular() {
    var mk = P.makler || {}, menoM = mk.meno_cele || mk.meno || "", pod = podobna();
    var zdroj = pod ? "podobna" : Z.zdroj, cb = zdroj === "callback", v = Z.v;
    var h = '<div class="v-box v-zaujem" id="zaujem">';
    if (Z.hotovo) {
      return h + '<h2>Ďakujeme, správa je odoslaná</h2><p class="v-zaujem-t">' + (Z.hotovoTermin ? "Navrhli ste termín <b>" + esc(Z.hotovoTermin) + "</b>. " + (menoM ? esc(menoM) + " vám ho" : "Termín vám") + " potvrdí čo najskôr."
        : (menoM ? esc(menoM) + " sa vám ozve" : "Ozveme sa vám") + " čo najskôr.") + "</p>" +
        '<button type="button" class="v-btn" data-znova>Poslať ďalšiu správu</button></div>';
    }
    if (pod) {
      h += "<h2>Hľadáte podobnú?</h2><p class=\"v-zaujem-t\">" + (P.stav === "predane" ? "Táto nehnuteľnosť je už predaná. Nechajte nám kontakt a ozveme sa vám, keď budeme mať podobnú."
        : "Táto nehnuteľnosť je rezervovaná. Nechajte nám kontakt – ozveme sa, ak sa uvoľní, alebo keď budeme mať podobnú.") + "</p>";
    } else {
      h += '<h2>Mám záujem</h2><div class="v-volby" role="group" aria-label="Čo potrebujete">' + ZDROJE.map(function (z) {
        return '<button type="button" data-zdroj="' + z[0] + '" aria-pressed="' + (Z.zdroj === z[0]) + '">' + z[1] + "</button>";
      }).join("") + "</div>";
    }
    var plac = { obhliadka: Z.termin ? "Poznámka (nepovinné)" : "Kedy sa vám obhliadka hodí? (nepovinné)", kontakt: "Na čo sa chcete opýtať?", callback: "Kedy vám môžeme zavolať? (nepovinné)", podobna: "Čo presne hľadáte? (nepovinné)" }[zdroj];
    var tlac = { obhliadka: "Chcem obhliadku", kontakt: "Odoslať otázku", callback: "Zavolajte mi", podobna: "Ozvite sa mi" }[zdroj];
    return h + '<form class="v-form" novalidate data-zaujem-form>' +
      (zdroj === "obhliadka" && P.stav === "aktivne" && KARTA.moznosti.termin ? vyberTerminu() : "") +
      '<label><span>Meno</span><input name="meno" autocomplete="name" maxlength="80" value="' + esc(v.meno || "") + '"></label>' +
      "<label><span>" + (cb ? "Telefón" : "Telefón alebo e-mail") + '</span><input name="kontakt" maxlength="120" required ' +
        (cb ? 'type="tel" inputmode="tel" autocomplete="tel"' : 'type="text" autocomplete="tel"') + ' value="' + esc(v.kontakt || "") + '"></label>' +
      '<label><span>Správa</span><textarea name="co" rows="3" maxlength="1500" placeholder="' + esc(plac) + '">' + esc(v.co || "") + "</textarea></label>" +
      '<input class="v-med" name="web" tabindex="-1" autocomplete="off" aria-hidden="true">' +
      (Z.chyba ? '<p class="v-chyba" role="alert">' + esc(Z.chyba) + "</p>" : "") +
      '<button class="v-btn zlate" type="submit"' + (Z.posiela ? " disabled" : "") + ">" + (Z.posiela ? "Odosielam…" : tlac) + "</button>" +
      '<p class="v-mini">' + (NAHLAD ? "Toto je náhľad – formulár sa neodošle." : "Vaše údaje použijeme iba na to, aby sme sa vám ozvali.") + "</p></form></div>";
  }
  function kresliFormular(fokus) {
    var st = document.getElementById("zaujem"); if (!st) return;
    var d = document.createElement("div"); d.innerHTML = formular(); st.replaceWith(d.firstChild); napojFormular();
    if (fokus) { var x = document.querySelector('#zaujem [name="' + fokus + '"]'); if (x) x.focus(); }
    zarovnajBok();
  }
  function zdrojFormulara() { return podobna() ? "podobna" : Z.zdroj; }
  function napojFormular() {
    var box = document.getElementById("zaujem"); if (!box) return;
    box.querySelectorAll("[data-zdroj]").forEach(function (b) { b.onclick = function () { Z.zdroj = b.dataset.zdroj; Z.chyba = ""; kresliFormular(); }; });
    box.querySelectorAll("[data-den]").forEach(function (b) { b.onclick = function () { var i = Number(b.dataset.den); Z.den = Z.den === i ? null : i; Z.termin = null; kresliFormular(); }; });
    box.querySelectorAll("[data-cas]").forEach(function (b) {
      b.onclick = function () {
        if (Z.termin === b.dataset.cas) { Z.termin = null; Z.terminTxt = ""; kresliFormular(); return; }
        var d = new Date(b.dataset.cas), c = casti(d), x = dniObhliadky()[Z.den];
        Z.termin = b.dataset.cas; Z.terminTxt = DNI_DLHE[x.wd] + " " + x.d + ". " + x.m + ". o " + Number(c.hour) + ":00"; Z.chyba = ""; kresliFormular();
      };
    });
    var zn = box.querySelector("[data-znova]"); if (zn) zn.onclick = function () { Z.hotovo = false; kresliFormular("meno"); };
    var f = box.querySelector("[data-zaujem-form]"); if (!f) return;
    f.addEventListener("input", function (e) { if (e.target.name && e.target.name !== "web") Z.v[e.target.name] = e.target.value; });
    // úloha proti robotom sa začne počítať hneď, ako človek začne písať – odoslanie je potom okamžité
    f.addEventListener("focusin", function () { if (!NAHLAD) T.overenie("ponuka-" + P.id, zdrojFormulara()); }, { once: true });
    f.addEventListener("submit", function (e) { e.preventDefault(); odoslat(f); });
  }
  function odoslat(f) {
    var zdroj = zdrojFormulara(), kontakt = f.kontakt.value.trim(), meno = f.meno.value.trim(), co = f.co.value.trim(), med = f.web.value;
    Z.v = { meno: meno, kontakt: kontakt, co: co };
    if (NAHLAD) { toast("Toto je náhľad – formulár sa neodosiela."); return; }
    if (kontakt.length < 5) { Z.chyba = zdroj === "callback" ? "Napíšte telefónne číslo, aby sme vám mohli zavolať." : "Napíšte telefón alebo e-mail, aby sme sa vám mohli ozvať."; kresliFormular("kontakt"); return; }
    if (zdroj === "kontakt" && !co) { Z.chyba = "Napíšte, na čo sa chcete opýtať."; kresliFormular("co"); return; }
    Z.posiela = true; Z.chyba = ""; kresliFormular();
    T.overenie("ponuka-" + P.id, zdroj).then(function (ov) {
      T.overeniePouzite(zdroj);
      var arg = { p_id: P.id, p_zdroj: zdroj, p_kontakt: kontakt, p_meno: meno || null, p_co: co || null, p_overenie: { ts: ov.ts, n: ov.n, med: med } };
      if (zdroj === "obhliadka" && Z.termin) arg.p_termin = Z.termin;
      return T.rpc("ponuka_kontakt", arg);
    }).then(function () {
      T.udalost("zaujem", { formular: zdroj, id: P.id });
      Z.posiela = false; Z.hotovo = true; Z.hotovoTermin = zdroj === "obhliadka" && Z.termin ? Z.terminTxt : ""; Z.v = {}; Z.termin = null; Z.terminTxt = ""; Z.den = null; Z.obs = null; kresliFormular();
    }, function (e) {
      Z.posiela = false; Z.chyba = (e && e.message) || "Správu sa nepodarilo odoslať. Skúste to znova alebo zavolajte.";
      if (/termín/.test(Z.chyba)) { Z.termin = null; Z.terminTxt = ""; Z.obs = null; }   // termín medzitým obsadili – načítať znova
      kresliFormular();
    });
  }

  // ---------------------------------------------------------------- ďalšie ponuky
  var DALSIE = null;
  function dalsiePonuky() {
    T.rpc("verejne_ponuky", { p_kancelaria: P.kancelaria || "alpha", p_makler: null }).then(function (L) { DALSIE = L || []; kresliDalsie(); }).catch(function () {});
  }
  function kresliDalsie() {
    var el = document.getElementById("dalsie"); if (!el) return;
    if (!DALSIE || !KARTA.moznosti.dalsie) { el.hidden = true; return; }
    (function (L) {
      var mid = P.makler && P.makler.id, jeho = function (x) { return x.makler && x.makler.id === mid ? 1 : 0; };
      L = (L || []).filter(function (x) { return x.id !== P.id; });
      if (!L.length) return;
      L = L.map(function (x, i) { return [x, i]; }).sort(function (a, b) { return jeho(b[0]) - jeho(a[0]) || a[1] - b[1]; }).map(function (x) { return x[0]; }).slice(0, 6);
      var mk = P.makler || {}, len = L.every(function (x) { return jeho(x); });
      el.innerHTML = '<h2>Ďalšie ponuky</h2><p class="v-dalsie-pod">' + (len && (mk.meno_cele || mk.meno) ? esc(mk.meno_cele || mk.meno) : '<span data-kanc="nazov">' + esc(T.kanc().nazov) + "</span>") + "</p>" +
        '<div class="v-dalsie">' + L.map(function (x) {
          var f = (x.fotky || [])[0], poz = x.kategoria === "pozemky", pl = poz ? x.plocha_pozemku : (x.plocha_uzitkova || x.plocha_pozemku);
          var meta = [x.obec, pl ? nf.format(pl) + " m²" : "", x.izby && !poz ? x.izby + (x.izby === 1 ? " izba" : x.izby <= 4 ? " izby" : " izieb") : ""].filter(Boolean).join(" · ");
          return '<a class="v-karta" href="ponuka.html?id=' + x.id + '"><span class="v-karta-f">' + (f ? '<img loading="lazy" src="' + esc(T.fotkaUrl(f)) + '" alt="">' : "<i>" + (KAT[x.kategoria] || "🏠") + "</i>") +
            (x.stav === "rezervovane" ? '<em>Rezervované</em>' : "") + '</span><span class="v-karta-t"><b>' + esc(T.cena(x)) + "</b><span>" + esc(T.nazov(x)) + "</span><small>" + esc(meta) + "</small></span></a>";
        }).join("") + "</div>";
      el.hidden = false;
    })(DALSIE);
  }

    if (id === "mapa") {

    }
    if (id === "hypoteka") return hypoteka();

  function zapnute(id) { return KARTA.bloky.some(function (b) { return b.id === id && b.zap; }); }
  function vykresli() {
    var stav = P.stav === "rezervovane" ? '<div class="v-stav rez">Rezervované</div>' : P.stav === "predane" ? '<div class="v-stav pred">' + (P.transakcia === "prenajom" ? "Prenajaté" : "Predané") + "</div>" :

        : '<div class="v-nic"><b>Ponuka už nie je dostupná</b>' + (T.kanc().web ? 'Pozrite si ďalšie ponuky na <a href="' + esc(T.kanc().web) + '">' + esc(T.kanc().webText) + "</a>." : "Pozrite si naše ďalšie ponuky.") + "</div>";

    P = p; vykresli(); dalsiePonuky();
    if (!NAHLAD) T.udalost("ponuka", { id: p.id, nazov: T.nazov(p), cena: p.zobrazit_cenu === false ? 0 : (p.cena || 0) });
    if (p.makler && p.makler.id) T.rpc("verejne_recenzie", { p_makler: p.makler.id }).then(function (r) {
      var h = document.getElementById("mk-hodn"); if (!h || !r || !r.pocet) return;
      h.innerHTML = '<a href="makler.html?id=' + esc(p.makler.id) + '#rec-sek"><span>★</span> ' + String(r.priemer).replace(".", ",") + " · " + r.pocet + (r.pocet === 1 ? " recenzia" : r.pocet <= 4 ? " recenzie" : " recenzií") + "</a>";
      zarovnajBok();
    }).catch(function () {});
    if (!NAHLAD) T.rpc("zaznamenat_zobrazenie", { p_id: id }).catch(function () {});
  }).catch(function (e) {
    document.getElementById("obsah").innerHTML = '<div class="v-nic"><b>Ponuku sa nepodarilo načítať</b>' + esc(e.message || e) + "</div>";
  });
})();
</script>
