<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#1e2a35">
<title>Odhad hodnoty nehnuteľnosti · Alpha Reality</title>
<link rel="stylesheet" href="pisma/pisma.css?v=20261105">
<link rel="stylesheet" href="verejne.css?v=202610281600">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<style>
/* Odhad hodnoty – stránka na stiahnutie ako PDF (A4). Odkaz s náhodným kľúčom pošle maklér klientovi (migrácia 110, odhad_list). */
.o-wrap { max-width: 820px; margin: 0 auto; padding: 22px max(16px, env(safe-area-inset-left, 0px)) 48px; display: grid; gap: 16px }
.o-lista { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap }
.o-lista p { margin: 0; color: var(--muted); font-size: 14px }
.o-tlac { display: inline-flex; align-items: center; gap: 8px; border: 0; border-radius: 999px; padding: 11px 20px; background: var(--gold-strong); color: #1e2a35; font: inherit; font-weight: 700; cursor: pointer }
.o-hl small { display: block; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--gold) }
.o-hl h1 { font-family: var(--display); font-size: clamp(22px, 3.4vw, 30px); line-height: 1.2; margin: 6px 0 4px }
.o-hl .o-adr { color: var(--muted); font-size: 15px }
.o-cena { background: var(--graphite); color: #f1efe8; border-radius: 16px; padding: 20px 22px; display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap;
  -webkit-print-color-adjust: exact; print-color-adjust: exact }
.o-cena small { display: block; color: #c9d4dd; font-size: 13px }
.o-cena b { display: block; font-family: var(--display); font-size: clamp(26px, 4.6vw, 36px); color: #db9522; letter-spacing: -.01em; margin-top: 4px; font-variant-numeric: tabular-nums }
.o-cena .o-pre { text-align: right; font-size: 14px; color: #c9d4dd }
.o-cena .o-pre strong { display: block; color: #f1efe8; font-size: 15px }
.o-tab { width: 100%; border-collapse: collapse; font-size: 14.5px }
.o-tab th { text-align: left; font-weight: 600; color: var(--muted); padding: 7px 14px 7px 0; vertical-align: top; width: 34%; white-space: nowrap }
.o-tab td { padding: 7px 0; border-bottom: 1px solid var(--line) }
.o-tab tr:last-child td { border-bottom: 0 }
.o-text { font-size: 15.5px; line-height: 1.65; white-space: pre-line; margin: 0 }
.o-por p { margin: 0 0 10px; color: var(--muted); font-size: 14px }
.o-por table { width: 100%; border-collapse: collapse; font-size: 13.5px }
.o-por th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 600; padding: 0 8px 6px 0; border-bottom: 1px solid var(--line) }
.o-por td { padding: 7px 8px 7px 0; border-bottom: 1px solid var(--line); vertical-align: top }
.o-por td.n, .o-por th.n { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums }
.o-por .z { color: var(--muted); font-size: 12px }
.o-mk { display: flex; align-items: center; gap: 14px }
.o-mk b { display: block; font-size: 17px }
.o-mk small { display: block; color: var(--muted); font-size: 14px }
.o-mk a { color: inherit; font-weight: 600; text-decoration: none }
.o-podm { font-size: 12px; color: var(--muted); line-height: 1.5; margin: 0; padding-left: 18px }
.o-podm li + li { margin-top: 4px }
@page { size: A4; margin: 13mm 12mm }
@media print {
  body { background: #fff }
  .v-top { -webkit-print-color-adjust: exact; print-color-adjust: exact }
  .o-lista, .v-pata { display: none }
  .o-wrap { padding: 0; gap: 12px; max-width: none }
  .v-box { border-color: #e6ddcb; padding: 14px 16px; break-inside: avoid }
  .o-cena, .o-mk { break-inside: avoid }
}
</style>
</head>
<body data-kanc-caka>
<header class="v-top"><div class="v-wrap">
  <a href="https://www.alphareality.sk/" data-kanc-web><img src="logo.png" alt="Alpha Reality"></a>
  <div class="v-top-t">Odhad hodnoty nehnuteľnosti</div>
</div></header>
<main class="o-wrap" id="obsah"><div class="v-nic">Načítavam odhad…</div></main>
<footer class="v-wrap v-pata">© <span data-kanc="firma">Alpha Reality s.r.o.</span><span hidden data-kanc="nazov">Alpha Reality</span> · Odhad je určený len pre vás – nezdieľajte, prosím, tento odkaz.</footer>
<script src="config.js?v=202610182100"></script>
<script src="verejne.js?v=202611031900"></script>
<script>
(function () {
  var T = window.TYPEK, esc = T.esc, tok = T.param("t");
  var TYP = { byt: "Byt", dom: "Rodinný dom", pozemok: "Pozemok", ine: "Iná nehnuteľnosť" };
  function m2(v) { return T.nf.format(Math.round(Number(v))) + " m²"; }
  function rozpatie(od, d) { return d && Number(d) !== Number(od) ? T.nf.format(od) + " – " + T.nf.format(d) + " €" : T.nf.format(od) + " €"; }
  function vykresli(R) {
    var o = R.odhad, m = R.makler || {}, P = R.porovnanie, riadky = [];
    function r(k, v) { if (v !== null && v !== undefined && String(v).trim() !== "") riadky.push("<tr><th>" + k + "</th><td>" + v + "</td></tr>"); }
    var adr = [[o.ulica, o.cislo].filter(Boolean).join(" "), o.cast_obce, o.obec].filter(Boolean).join(", ");
    r("Druh", esc(TYP[o.typ] || "") + (o.druh_pozemku ? " – " + esc(o.druh_pozemku.toLowerCase()) : "") + (o.popis ? " – " + esc(o.popis) : ""));
    r("Lokalita", esc([o.obec, o.okres && o.okres !== o.obec ? "okres " + o.okres : ""].filter(Boolean).join(", ")));
    r(o.typ === "dom" ? "Úžitková plocha" : o.typ === "pozemok" ? "Výmera" : "Plocha", o.plocha ? m2(o.plocha) : "");
    r("Pozemok", o.pozemok ? m2(o.pozemok) : "");
    r("Izby", esc(o.izby || ""));
    r("Poschodie", o.poschodie !== undefined ? (o.poschodie === 0 ? "prízemie" : esc(o.poschodie) + ".") + (o.poschodi ? " z " + esc(o.poschodi) : "") : "");
    r("Stav", esc(o.stav_nehn || ""));
    var rk = o.rekonstrukcia || {}, REK = [["elektro", "elektroinštalácia"], ["jadro", "bytové jadro"], ["podlahy", "podlahy"], ["kuchyna", "kuchynská linka"]];
    var rekT = function (v) { var t = REK.filter(function (x) { return rk[x[0]] === v; }).map(function (x) { return x[1]; }).join(", "); return t ? t.charAt(0).toUpperCase() + t.slice(1) : ""; };
    r("Nové", esc(rekT("nove")));
    r("Pôvodné", esc(rekT("povodne")));
    r("Rekonštrukcia", esc(({ "2021+": "2021 a neskôr", "2016-2020": "2016 – 2020", "2010-2015": "2010 – 2015", "pred-2010": "pred rokom 2010" }[rk.kedy] || "") + (rk.nadstandard ? (rk.kedy && rk.kedy !== "neviem" ? ", " : "") + "nadštandardná" : "")));
    var dal = (rk.dalsie || []).map(function (x) { return { dvere: "vchodové dvere", stropy: "stropy", svietidla: "nové svietidlá" }[x] || ""; }).filter(Boolean).join(", ");
    r("Ešte nové", esc(dal ? dal.charAt(0).toUpperCase() + dal.slice(1) : ""));
    r("Siete", esc((o.siete || []).join(", ")));
    r("Vybavenie", esc((o.doplnky || []).join(", ")));
    var tel = T.telOdkaz(m.telefon), datum = T.datum(o.datum);
    var por = "";
    if (P && P.podobne && P.podobne.length) {
      var s = P.stat;
      por = '<section class="v-box o-por"><h2>Porovnateľné ponuky v okolí</h2>' +
        "<p>Ponukové ceny z realitných portálov za posledný rok" + (s ? " – " + esc(s.oblast) + ", " + s.pocet + (s.pocet < 5 ? " inzeráty" : " inzerátov") + ", bežne " + T.nf.format(s.m2_od) + " – " + T.nf.format(s.m2_do) + " €/m²" : "") +
        ". Ponuková cena nie je predajná – skutočné predaje bývajú o niečo nižšie.</p>" +
        '<table><thead><tr><th>Ponuka</th><th class="n">Plocha</th><th class="n">Cena</th><th class="n">€/m²</th></tr></thead><tbody>' +
        P.podobne.map(function (z) {
          return "<tr><td>" + esc(z.nazov || "Inzerát") + '<div class="z">' + esc(z.obec || "") + " · " + (z.aktivny ? "v ponuke" : "už nie je v ponuke") + "</div></td>" +
            '<td class="n">' + (z.plocha ? m2(z.plocha) : "–") + '</td><td class="n">' + T.nf.format(z.cena) + ' €</td><td class="n">' + T.nf.format(Math.round(z.cena_m2)) + "</td></tr>";
        }).join("") + "</tbody></table></section>";
    }
    document.getElementById("obsah").innerHTML =
      '<div class="o-lista"><p>Odhad si uložíte ako PDF tlačidlom vpravo (v okne tlače vyberte „Uložiť ako PDF“).</p><button type="button" class="o-tlac" id="tlac">📄 Uložiť ako PDF / vytlačiť</button></div>' +
      '<section class="o-hl"><small>Odhad hodnoty nehnuteľnosti</small><h1>' + esc(o.nazov || TYP[o.typ] || "Nehnuteľnosť") + '</h1><div class="o-adr">📍 ' + esc(adr) + "</div></section>" +
      '<section class="o-cena"><div><small>Orientačná hodnota k ' + esc(datum) + "</small><b>" + rozpatie(o.cena_od, o.cena_do) + "</b></div>" +
        (o.meno ? '<div class="o-pre">Pripravené pre<strong>' + esc(o.meno) + "</strong></div>" : "") + "</section>" +
      (o.text ? '<section class="v-box"><p class="o-text">' + esc(o.text) + "</p></section>" : "") +
      '<section class="v-box"><h2>Údaje o nehnuteľnosti</h2><table class="o-tab">' + riadky.join("") + "</table></section>" + por +
      '<section class="v-box"><div class="o-mk">' + T.avatar(m, 62) + "<div><b>" + esc(m.meno_cele || m.meno || T.kanc().nazov) + "</b><small>" + (m.pohlavie === "zena" ? "Realitná maklérka" : "Realitný maklér") +
        ' · <span data-kanc="nazov">' + esc(T.kanc().nazov) + "</span></small>" +
        (tel ? '<small><a href="tel:' + esc(tel) + '">' + esc(m.telefon) + "</a></small>" : "") + (m.email ? '<small><a href="mailto:' + esc(m.email) + '">' + esc(m.email) + "</a></small>" : "") + "</div></div></section>" +
      '<section><ol class="o-podm"><li>Odhad je orientačný, vychádza z údajov od vás a zo znalosti miestneho trhu a platí ku dňu vydania. Nejde o znalecký posudok podľa zákona č. 382/2004 Z. z. a nemožno ho použiť tam, kde predpis vyžaduje znalecký posudok.</li>' +
        "<li>Presnejšiu cenu vie maklér určiť po osobnej obhliadke nehnuteľnosti.</li>" +
        "<li>Odhad slúži len na vašu osobnú, nezáväznú potrebu. Bez písomného súhlasu realitnej kancelárie ho nemožno použiť v súdnom, exekučnom, dedičskom, daňovom ani inom konaní či spore.</li></ol></section>";
    document.title = "Odhad hodnoty – " + (o.nazov || "nehnuteľnosť");
    document.getElementById("tlac").onclick = function () { window.print(); };
  }
  if (!tok) { document.getElementById("obsah").innerHTML = '<div class="v-nic"><b>Neplatný odkaz</b>Odkaz na odhad nie je úplný.</div>'; return; }
  T.rpc("odhad_list", { p_token: tok }).then(function (R) {
    if (!R) { document.getElementById("obsah").innerHTML = '<div class="v-nic"><b>Odhad nie je dostupný</b>Odkaz je neplatný alebo už neaktívny. Kontaktujte svojho makléra.</div>'; return; }
    T.kancelaria(R.kancelaria_id, R.kanc);
    vykresli(R);
  }).catch(function (e) { document.getElementById("obsah").innerHTML = '<div class="v-nic"><b>Odhad sa nepodarilo načítať</b>' + esc(e.message || e) + "</div>"; });
})();
</script>
</body>
</html>
